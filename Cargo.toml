[workspace]
members = ["html-form-derive"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Let-chains, which the crate uses throughout. Edition 2024 alone would be 1.85.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Liam Perlaki <liam@perlaki.org>"]
repository = "https://github.com/lperlaki/html-form-rs"

[package]
name = "html-form"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Declarative HTML forms: render, parse and validate the same struct"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["html", "form", "validation", "forms", "web"]
categories = ["web-programming", "template-engine"]

[dependencies]
form_urlencoded = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
html-form-derive = { path = "html-form-derive", version = "0.1.0", optional = true }
regex-lite = { version = "0.1.9", optional = true }
axum-core = { version = "0.5.6", optional = true }
bytes = { version = "1.12.1", optional = true }
http = { version = "1.5.0", optional = true }

[features]
default = ["derive", "pattern", "html"]
# `#[derive(Form)]` / `#[derive(FormChoice)]`
derive = ["dep:html-form-derive"]
# The built-in renderer: `FormView::to_html`, `FieldView::to_html`, the
# `Display` impls and `escape`. Without it a view is still what a template
# engine renders from, and nothing else in the crate changes.
html = []
# `pattern = "..."` constraints are checked server-side with a regex engine.
# Without this feature `pattern` is still rendered into the HTML, but only
# enforced by the browser.
pattern = ["dep:regex-lite"]
# `Outcome<T>` is an axum extractor (axum 0.8). With `derive` it also unlocks
# `#[form(renderer = ...)]`, which the derive crate has to be told about: only
# then does it emit the two impls that name this module.
axum = ["dep:axum-core", "dep:bytes", "dep:http", "html-form-derive?/axum"]

[dev-dependencies]
# The crate's own tests, examples and doctests render markup and cover the axum
# integration, so they need those two features whether or not they are in the
# default set: `cargo test` would otherwise fail to compile them.
#
# `axum` is here because the crate's documentation is the README and
# `docs/guide.md`, and the guide documents the extractors. A doc comment can be
# `#[cfg]`-gated; a line of an
# included file cannot, so the feature is on wherever doctests run. This changes
# nothing about what a dependent gets — `axum` is still off by default.
html-form = { path = ".", features = ["html", "axum"] }
minijinja = "2.23.0"
serde_json = "1.0"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
# A request body that fails part way through, which is the one thing the axum
# tests cannot build out of bytes. Already in the tree, under axum.
futures-util = { version = "0.3.33", default-features = false }

[[example]]
name = "axum_signup"
required-features = ["axum", "html", "derive"]

[package.metadata.docs.rs]
all-features = true
# Turns on `doc_cfg`, so each item says which feature gates it. The gate is
# read off the `#[cfg]` already there, so no item has to repeat it.
rustdoc-args = ["--cfg", "docsrs"]
