[workspace]
members = ["web-form-derive"]

[package]
name = "web-form"
version = "0.1.0"
edition = "2024"
description = "Declarative HTML forms: render, parse and validate the same struct"
license = "MIT OR Apache-2.0"

[dependencies]
form_urlencoded = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
web-form-derive = { path = "web-form-derive", version = "0.1.0", optional = true }
regex-lite = { version = "0.1.9", optional = true }
axum-core = { version = "0.5.6", optional = true }
bytes = { version = "1.12.1", optional = true }
http = { version = "1.5.0", optional = true }

[features]
default = ["derive", "pattern"]
# `#[derive(WebForm)]` / `#[derive(FormChoice)]`
derive = ["dep:web-form-derive"]
# `pattern = "..."` constraints are checked server-side with a regex engine.
# Without this feature `pattern` is still rendered into the HTML, but only
# enforced by the browser.
pattern = ["dep:regex-lite"]
# `Outcome<T>` is an axum extractor (axum 0.8).
axum = ["dep:axum-core", "dep:bytes", "dep:http"]

[dev-dependencies]
minijinja = "2.22.0"
serde_json = "1.0"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "axum_signup"
required-features = ["axum"]

[package.metadata.docs.rs]
all-features = true
